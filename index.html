
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mathnasium Display</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-layout">

    <!-- HEADER: Centered logo -->
    <header class="site-header">
      <img src="images/header.png" alt="Mathnasium Logo">
    </header>

    <!-- Yellow stripe and black divider -->
    <div class="top-divider"></div>

    <!-- MAIN CONTENT: Three image panels -->
    <main class="dashboard">

      <section class="dashboard-panel">
        <img
          src="images/left.png"
          alt="Left Display"
          class="panel-image"
        >
      </section>

      <section class="dashboard-panel">
        <img
          src="images/center.png"
          alt="Center Display"
          class="panel-image"
        >
      </section>

      <section class="dashboard-panel">
        <img
          src="images/right.png"
          alt="Right Display"
          class="panel-image"
        >
      </section>

    </main>
  </div>

  <!-- Subtle animated accent -->
  <div class="screen-accent" aria-hidden="true"></div>

  <!-- Keep the screen awake when supported -->
  <script>
    let wakeLock = null;

    async function keepScreenAwake() {
      if (!("wakeLock" in navigator)) {
        console.log("Screen Wake Lock is not supported.");
        return;
      }

      try {
        // Avoid requesting another lock if one is already active
        if (wakeLock && !wakeLock.released) {
          return;
        }

        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });

        console.log("Screen wake lock is active.");
      } catch (error) {
        console.log("Could not activate screen wake lock:", error);
      }
    }

    // Reacquire the lock when returning to the page
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        keepScreenAwake();
      }
    });

    // Request the lock on page load
    keepScreenAwake();
  </script>
</body>
</html>
