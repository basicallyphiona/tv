
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mathnasium Display</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-layout">

    <!-- HEADER: Logo image -->
    <header class="site-header">
      <img src="images/header.png" alt="Mathnasium Logo">
    </header>

    <!-- Yellow line and black divider -->
    <div class="top-divider"></div>

    <!-- MAIN CONTENT: Three image containers -->
    <main class="dashboard">

      <!-- LEFT IMAGE CONTAINER -->
      <section class="dashboard-panel">
        <img
          src="images/left.jpg"
          alt="Left Display"
          class="panel-image"
        >
      </section>

      <!-- CENTER IMAGE CONTAINER -->
      <section class="dashboard-panel">
        <img
          src="images/center.jpg"
          alt="Center Display"
          class="panel-image"
        >
      </section>

      <!-- RIGHT IMAGE CONTAINER -->
      <section class="dashboard-panel">
        <img
          src="images/right.jpg"
          alt="Right Display"
          class="panel-image"
        >
      </section>

    </main>

  </div>
</body>
</html>
