
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mathnasium Display</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<!-- Subtle animated accent -->
<div class="screen-accent" aria-hidden="true"></div>
</body>
</html>


<script>
  // Keep a reference to the active screen wake lock
  let wakeLock = null;

  // Request that the screen stays awake
  async function keepScreenAwake() {
    if (!("wakeLock" in navigator)) {
      console.log("Screen Wake Lock is not supported.");
      return;
    }

    try {
      wakeLock = await navigator.wakeLock.request("screen");
      console.log("Screen wake lock is active.");
    } catch (error) {
      console.log("Could not activate screen wake lock:", error);
    }
  }

  // Try again when the page becomes visible
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      keepScreenAwake();
    }
  });

  // Request the lock when the page loads
  keepScreenAwake();
</script>
</body>
</html>


<body>
  <div class="page-layout">

    <!-- HEADER: Logo image -->
    <header class="site-header">
      <img src="images/header.png" alt="Mathnasium Logo">
    </header>

    <!-- Yellow line and black divider -->
    <div class="top-divider"></div>

    <!-- MAIN CONTENT: Three image containers -->
    <main class="dashboard">

      <!-- LEFT IMAGE CONTAINER -->
      <section class="dashboard-panel">
        <img
          src="images/left.png"
          alt="Left Display"
          class="panel-image"
        >
      </section>

      <!-- CENTER IMAGE CONTAINER -->
      <section class="dashboard-panel">
        <img
          src="images/center.jpg"
          alt="Center Display"
          class="panel-image"
        >
      </section>

      <!-- RIGHT IMAGE CONTAINER -->
      <section class="dashboard-panel">
        <img
          src="images/right.png"
          alt="Right Display"
          class="panel-image"
        >
      </section>

    </main>

  </div>
</body>
</html>
