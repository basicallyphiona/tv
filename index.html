
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Defines the character encoding for the webpage -->
  <meta charset="UTF-8">

  <!-- Makes the layout responsive on phones, tablets, and desktops -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- The title displayed in the browser tab -->
  <title>My Bootstrap Website</title>

  <!-- Imports Bootstrap 5 CSS for the grid and responsive utilities -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Imports our custom CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Main wrapper: arranges the header, content, and footer vertically -->
  <div class="page-layout">

    <!-- HEADER: compact area at the top of the webpage -->
    <header class="site-header">
      <!-- Replace this path with your actual header image -->
      <img src="images/header.png" alt="Header">
    </header>

    <!-- MAIN CONTENT: expands to use the available page space -->
    <main class="container-fluid flex-grow-1">

      <!-- Bootstrap row containing the two center columns -->
      <div class="row g-3 center-content">

        <!-- LEFT COLUMN: occupies half the row on medium screens and larger -->
        <!-- col-12 makes it full-width on smaller screens -->
        <div class="col-12 col-md-6">
          <div class="image-panel">
            <!-- Main image on the left -->
            <img src="images/left.jpg" alt="First main image">
          </div>
        </div>

        <!-- RIGHT COLUMN: occupies the other half of the row -->
        <div class="col-12 col-md-6">
          <div class="image-panel">
            <!-- Main image on the right -->
            <img src="images/right.jpg" alt="Second main image">
          </div>
        </div>

      </div>
    </main>

    <!-- FOOTER: compact area at the bottom of the webpage -->
    <footer class="site-footer">
      <!-- Replace this path with your actual footer image -->
      <img src="images/footer.png" alt="Footer">
    </footer>

  </div>
</body>
</html>
